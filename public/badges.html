<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEDUSA Badge Printing</title><link rel="stylesheet" href="/styles.css">
<style>
:root{--navy:#031d4a;--green:#079448;--gold:#b9881a}.badge-controls{max-width:1100px;margin:24px auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 24px #11223a17}.badge-controls .row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.badge-controls label{font-weight:800;flex:1;min-width:220px}.badge-controls input{display:block;width:100%;padding:12px;border:1px solid #cad4e2;border-radius:9px;margin-top:5px}.badge-sheet{display:grid;grid-template-columns:repeat(2,86mm);justify-content:center;gap:12mm 10mm;padding:10mm}.badge-pair{display:grid;grid-template-columns:1fr 1fr;gap:6mm;grid-column:1/-1;justify-content:center}.badge{width:86mm;height:130mm;background:#fff;border-radius:4mm;overflow:hidden;position:relative;box-shadow:0 8px 25px #001b3d25;border:1px solid #d8e0ea;break-inside:avoid;display:flex;flex-direction:column;color:#06183c}.badge-header{height:31mm;background:linear-gradient(120deg,var(--navy) 0 67%,#fff 67% 73%,var(--green) 73% 86%,#d9a226 86%);padding:7mm 6mm;display:flex;align-items:center}.badge-header img{width:45mm;height:19mm;object-fit:contain;object-position:left center;filter:brightness(0) invert(1)}.badge-main{flex:1;padding:5mm 6mm;text-align:center;display:flex;flex-direction:column;align-items:center}.photo{width:30mm;height:30mm;border-radius:50%;object-fit:cover;border:1.2mm solid #fff;outline:.4mm solid var(--green);background:#edf1f5}.badge h2{font-size:7mm;line-height:.92;margin:3mm 0 1mm;text-transform:uppercase}.type-bar{padding:1.2mm 5mm;border-radius:2mm;color:#fff;font-size:3.5mm;font-weight:900;margin:1mm 0}.vip .type-bar{background:linear-gradient(90deg,#a77810,#c7982b)}.affiliate .type-bar{background:linear-gradient(90deg,#07813c,#11a653)}.org{font-weight:900;font-size:3.7mm;margin-top:1mm}.badge-id-label{font-size:2.8mm;color:var(--green);font-weight:900;margin-top:2.5mm}.badge-id{font-size:5mm;font-weight:900}.event-footer{background:var(--navy);color:#fff;padding:4mm 6mm;font-size:3mm;line-height:1.5;text-align:left}.event-footer div{display:flex;gap:3mm;align-items:center}.emergency{background:var(--green);color:#fff;padding:3mm 6mm;font-weight:900;font-size:3.5mm;display:flex;align-items:center;gap:3mm}.badge.back .badge-header{height:27mm;background:#fff;padding:6mm}.badge.back .badge-header img{filter:none;width:50mm;margin:auto}.badge.back .badge-main{justify-content:center}.badge.back .qr{width:43mm;height:43mm;object-fit:contain}.scan-copy{font-size:4mm;font-weight:900;margin-top:3mm}.badge-note{font-size:2.8mm;color:#68758a;margin-top:2mm}.side-label{text-align:center;font-size:3mm;font-weight:900;color:#506078;margin-bottom:2mm}.badge-wrap{display:flex;flex-direction:column;align-items:center}.hidden{display:none!important}@media(max-width:900px){.badge-sheet{display:flex;flex-direction:column;align-items:center;padding:15px}.badge-pair{display:flex;flex-direction:column}}@page{size:A4 portrait;margin:8mm}@media print{body{background:#fff}.topbar,.badge-controls{display:none!important}.badge-sheet{display:block;padding:0}.badge-pair{display:grid;grid-template-columns:86mm 86mm;gap:10mm;page-break-after:always;margin:0 auto 8mm;justify-content:center}.badge{box-shadow:none}.side-label{display:none}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="logo-mark"><img src="/assets/Fedusalogo.svg" alt="FEDUSA"></div><div><strong>FEDUSA</strong><span>Congress 2026 Badge Printing</span></div></div><a href="/admin.html" style="color:#fff">Admin</a></header>
<section class="badge-controls"><div class="row"><label>Admin PIN<input id="pin" type="password"></label><button class="primary-btn" id="load">Load badges</button><button class="outline-btn" onclick="print()">Print front & back</button></div><div id="msg" class="error hidden"></div></section><main id="badges" class="badge-sheet"></main>
<script>
const pin=document.querySelector('#pin'),badges=document.querySelector('#badges'),msg=document.querySelector('#msg');pin.value=sessionStorage.adminPin||'';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function front(x){const aff=x.registrationType==='affiliate',name=String(x.fullName||'').trim().split(/\s+/),first=name.shift()||'',last=name.join(' ');return `<div class="badge-wrap"><div class="side-label">FRONT</div><article class="badge ${aff?'affiliate':'vip'}"><div class="badge-header"><img src="/assets/Fedusalogo.svg" alt="FEDUSA Congress 2026"></div><div class="badge-main"><img class="photo" src="${x.headshotUrl}" alt="${esc(x.fullName)}" onerror="this.onerror=null;this.removeAttribute('src');this.alt='Headshot unavailable'"><h2>${esc(first)}<br>${esc(last)}</h2><div class="type-bar">${aff?'AFFILIATE DELEGATE':'NOB / INTERNATIONAL DELEGATE'}</div><div class="org">${aff?'AFFILIATE: '+esc(x.affiliate||'FEDUSA'):esc(x.jobTitle||x.affiliate||'FEDUSA')}</div><div class="badge-id-label">BADGE ID</div><div class="badge-id">${esc(x.badgeId)}</div></div><div class="event-footer"><div>▣ <b>14 – 16 OCTOBER 2026</b></div><div>⌖ RADISSON BLU OR TAMBO CONVENTION CENTRE</div><div>&nbsp;&nbsp;&nbsp;JOHANNESBURG, SOUTH AFRICA</div></div><div class="emergency">☎ <span>EMERGENCY CONTACT<br>062 454 3261</span></div></article></div>`}
function back(x){return `<div class="badge-wrap"><div class="side-label">BACK</div><article class="badge back"><div class="badge-header"><img src="/assets/Fedusalogo.svg" alt="FEDUSA Congress 2026"></div><div class="badge-main"><img class="qr" src="${x.badgeQrUrl}" alt="Check-in QR" onerror="this.onerror=null;this.removeAttribute('src');this.alt='QR code unavailable'"><div class="scan-copy">Scan for check-in</div><div class="badge-note">One QR code for congress and authorised voting workflows</div></div><div class="event-footer"><div>▣ <b>14 – 16 OCTOBER 2026</b></div><div>⌖ RADISSON BLU OR TAMBO CONVENTION CENTRE</div><div>&nbsp;&nbsp;&nbsp;JOHANNESBURG, SOUTH AFRICA</div></div><div class="emergency">☎ <span>EMERGENCY CONTACT<br>062 454 3261</span></div></article></div>`}
document.querySelector('#load').onclick=async()=>{msg.classList.add('hidden');sessionStorage.adminPin=pin.value;const r=await fetch('/api/delegates?pin='+encodeURIComponent(pin.value)),d=await r.json();if(!r.ok){msg.textContent=d.error||'Unable to load badges';msg.classList.remove('hidden');return}badges.innerHTML=d.delegates.map(x=>`<section class="badge-pair">${front(x)}${back(x)}</section>`).join('')};
</script></body></html>
