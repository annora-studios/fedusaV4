name: Reset FEDUSA Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET FEDUSA DATA"
        required: true
        type: string

jobs:
  reset-database:
    if: ${{ inputs.confirmation == 'RESET FEDUSA DATA' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Netlify Blobs
        run: npm install @netlify/blobs

      - name: Reset FEDUSA data
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CONFIRM_RESET: ${{ inputs.confirmation }}
        run: node scripts/reset-fedusa-data.mjs
